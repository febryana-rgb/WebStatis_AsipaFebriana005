<main class="container section login-wrap">
    <div class="login-card">
        <div class="login-icon">💜</div>
        <span class="eyebrow">Welcome, K-Pop lover!</span>
        <h1>Login Komunitas</h1><p class="muted">Isi formulir untuk bergabung ke My Favorite K-Pop.</p>
        <form id="loginForm">
            <div class="mb-3">
                <label for="loginName" class="form-label">Username</label>
                <input type="text" class="form-control" id="loginName" placeholder="Masukkan username" required minlength="3">
            </div>
            <div class="mb-3">
                <label for="loginEmail" class="form-label">Email</label>
                <input type="email" class="form-control" id="loginEmail" placeholder="nama@gmail.com" required>
            </div>
            <div class="mb-3">
                <label for="loginPassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="loginPassword" placeholder="Minimal 8 karakter" required minlength="8">
            </div>
            <button type="submit" class="btn btn-purple w-100">Login</button>
            <p id="loginNotice" class="form-notice" aria-live="polite"></p>
        </form>
    </div>
</main>
